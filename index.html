<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Great Scholars Portal</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:Arial, sans-serif; }
  body { background:linear-gradient(135deg,#6a11cb,#2575fc); min-height:100vh; display:flex; justify-content:center; align-items:center; padding:20px; }
.container { background:#fff; border-radius:15px; padding:30px; width:100%; max-width:500px; box-shadow:0 10px 30px rgba(0,0,0,0.2); }
  h1 { text-align:center; color:#333; margin-bottom:20px; }
.logo { display:block; margin:0 auto 20px; width:80px; height:80px; border-radius:50%; background:#ddd; object-fit:cover; }
  input, select, button, textarea { width:100%; padding:12px; margin:8px 0; border:1px solid #ddd; border-radius:8px; font-size:16px; }
  button { background:#2575fc; color:#fff; border:none; cursor:pointer; font-weight:bold; }
  button:hover { background:#1a5edb; }
.btn-red { background:#ff4d4d; }
.btn-red:hover { background:#e63939; }
.btn-gray { background:#6c757d; }
.btn-gray:hover { background:#5a6268; }
.hidden { display:none; }
.tab-nav { display:flex; border-bottom:2px solid #eee; margin:15px 0; }
.tab-nav div { flex:1; text-align:center; padding:10px; cursor:pointer; color:#666; }
.tab-nav div.active { color:#2575fc; border-bottom:2px solid #2575fc; font-weight:bold; }
.story-card { background:#f8f9fa; padding:15px; margin:10px 0; border-radius:8px; border-left:4px solid #2575fc; }
.story-card h3 { color:#333; margin-bottom:8px; }
  table { width:100%; border-collapse:collapse; margin-top:10px; }
  th, td { border:1px solid #ddd; padding:8px; text-align:left; }
  th { background:#f2f2f2; }
.header-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; }
.header-bar h2 { margin:0; font-size:20px; }
.header-bar button { width:auto; padding:8px 15px; margin:0 5px; }
</style>
</head>
<body>
<div class="container">

  <div id="authPage">
    <img src="logo.png" alt="Logo" class="logo" onerror="this.src='https://via.placeholder.com/80'">
    <h1>Great Scholars Portal</h1>
    <div id="authForms">
      <div id="loginForm">
        <h3>Login</h3>
        <select id="loginRole">
          <option value="">Select Role</option>
          <option value="Student">Student</option>
          <option value="Teacher">Teacher</option>
          <option value="Admin">Admin</option>
        </select>
        <select id="loginClass" class="hidden">
          <option value="">Select Class</option>
          <option value="JSS1">JSS1</option>
          <option value="JSS2">JSS2</option>
          <option value="JSS3">JSS3</option>
          <option value="SSS1">SSS1</option>
          <option value="SSS2">SSS2</option>
          <option value="SSS3">SSS3</option>
        </select>
        <input type="text" id="loginUsername" placeholder="Username">
        <input type="password" id="loginPassword" class="hidden" placeholder="Password">
        <button onclick="login()">Login</button>
        <p style="text-align:center; margin-top:10px;">No account? <a href="#" onclick="showRegister()">Register</a></p>
      </div>

      <div id="registerForm" class="hidden">
        <h3>Register</h3>
        <select id="regRole">
          <option value="">Select Role</option>
          <option value="Student">Student</option>
          <option value="Teacher">Teacher</option>
        </select>
        <select id="regClass" class="hidden">
          <option value="">Select Class</option>
          <option value="JSS1">JSS1</option>
          <option value="JSS2">JSS2</option>
          <option value="JSS3">JSS3</option>
          <option value="SSS1">SSS1</option>
          <option value="SSS2">SSS2</option>
          <option value="SSS3">SSS3</option>
        </select>
        <input type="text" id="regUsername" placeholder="Username">
        <input type="password" id="regPassword" class="hidden" placeholder="Create Password">
        <button onclick="register()">Register</button>
        <p style="text-align:center; margin-top:10px;">Have account? <a href="#" onclick="showLogin()">Login</a></p>
      </div>
    </div>
  </div>

  <div id="dashboard" class="hidden">
    <div class="header-bar">
      <h2 id="welcomeText"></h2>
      <div>
        <button class="btn-gray" onclick="goBack()">← Back</button>
        <button class="btn-red" onclick="logout()">Logout</button>
      </div>
    </div>

    <div class="tab-nav">
      <div id="tab-assignments" onclick="switchTab('assignments')">Assignments</div>
      <div id="tab-results" onclick="switchTab('results')">My Results</div>
      <div id="tab-stories" onclick="switchTab('stories')">Stories</div>
    </div>

    <div id="content-assignments" class="hidden">
      <h3>Your Assignments</h3>
      <div id="assignmentsList">No assignments yet.</div>
    </div>

    <div id="content-results" class="hidden">
      <h3>Your Results</h3>
      <div id="resultsList">No results yet.</div>
    </div>

    <div id="content-stories" class="hidden">
      <h3>Read Stories</h3>
      <select id="storyCategory" onchange="loadStories()">
        <option value="">Select Subject</option>
        <option value="Nigerian History">Nigerian History</option>
        <option value="Mathematics">Mathematics</option>
        <option value="English">English</option>
        <option value="Science">Science</option>
      </select>
      <div id="storiesList"></div>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = "greatScholarsDB";
let db = JSON.parse(localStorage.getItem(STORAGE_KEY)) || { users:[], assignments:[], results:[] };
let currentUser = null;

const stories = {
  "Nigerian History": [
    {
      title: "The Nigerian Civil War (1967-1970)",
      content: "The Nigerian Civil War, also called the Biafran War, started on July 6, 1967 when the southeastern region declared independence as the Republic of Biafra. The war was caused by ethnic tension, political instability, and the 1966 coups. It lasted 30 months and ended on January 15, 1970 when Biafra surrendered. The war caused over 1 million deaths, mostly from starvation and disease."
    },
    {
      title: "The First Republic (1963-1966)",
      content: "Nigeria became a republic on October 1, 1963, cutting ties with the British monarchy. Dr. Nnamdi Azikiwe became the first President, and Sir Abubakar Tafawa Balewa remained Prime Minister. This period was marked by parliamentary democracy but also political rivalry and regional tension. The First Republic ended with the military coup of January 15, 1966."
    },
    {
      title: "The Second Republic (1979-1983)",
      content: "After 13 years of military rule, Nigeria returned to civilian rule in 1979. Shehu Shagari of the National Party of Nigeria (NPN) was elected President under the new presidential system. The Second Republic focused on economic development and the 'Green Revolution' but faced corruption and economic problems. It was ended by a military coup on December 31, 1983 led by General Muhammadu Buhari."
    },
    {
      title: "Past Nigerian Leaders: Civilian & Military",
      content: "Nigeria has had both military and civilian leaders since independence in 1960. Military leaders include General Yakubu Gowon (1966-1975), General Olusegun Obasanjo (1976-1979), General Ibrahim Babangida (1985-1993), and General Sani Abacha (1993-1998). Civilian leaders include Dr. Nnamdi Azikiwe, Sir Abubakar Tafawa Balewa, Alhaji Shehu Shagari, and from 1999 onwards, Olusegun Obasanjo, Umaru Yar'Adua, Goodluck Jonathan, Muhammadu Buhari, and Bola Tinubu."
    }
  ],
  "Mathematics": [
    { title:"Algebra Basics", content:"Algebra uses letters to represent numbers. Example: If x+5=10, then x=5." },
    { title:"Fractions", content:"A fraction represents part of a whole. 1/2 means one out of two equal parts." }
  ],
  "English": [
    { title:"Parts of Speech", content:"The 8 parts of speech are noun, pronoun, verb, adjective, adverb, preposition, conjunction, and interjection." },
    { title:"Tenses", content:"Tenses show the time of an action: past, present, and future." }
  ],
  "Science": [
    { title:"The Water Cycle", content:"Water evaporates, forms clouds, condenses, and falls as rain in a continuous cycle." },
    { title:"Photosynthesis", content:"Plants use sunlight, water, and CO2 to make food and release oxygen." }
  ]
};

function saveDB() { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); }

function showRegister() {
  document.getElementById('loginForm').classList.add('hidden');
  document.getElementById('registerForm').classList.remove('hidden');
}
function showLogin() {
  document.getElementById('registerForm').classList.add('hidden');
  document.getElementById('loginForm').classList.remove('hidden');
}

document.getElementById('loginRole').addEventListener('change', function() {
  document.getElementById('loginClass').classList.toggle('hidden', this.value!== 'Student');
  document.getElementById('loginPassword').classList.toggle('hidden', this.value === 'Student');
});
document.getElementById('regRole').addEventListener('change', function() {
  document.getElementById('regClass').classList.toggle('hidden', this.value!== 'Student');
  document.getElementById('regPassword').classList.toggle('hidden', this.value === 'Student');
});

function register() {
  const role = document.getElementById('regRole').value;
  const username = document.getElementById('regUsername').value.trim();
  const password = document.getElementById('regPassword').value;
  const classVal = document.getElementById('regClass').value;

  if(!role ||!username) return alert("Fill all required fields");
  if(role === 'Student' &&!classVal) return alert("Select class for student");
  if(role!== 'Student' &&!password) return alert("Create a password");

  if(db.users.find(u => u.username === username)) return alert("Username already exists");

  db.users.push({ role, username, password, class: classVal });
  saveDB();
  alert("Registration successful! Login now.");
  showLogin();
}

function login() {
  const role = document.getElementById('loginRole').value;
  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value;
  const classVal = document.getElementById('loginClass').value;

  if(!role ||!username) return alert("Fill all required fields");

  let user;
  if(role === 'Student') {
    user = db.users.find(u => u.role==='Student' && u.username===username && u.class===classVal);
  } else {
    user = db.users.find(u => u.role===role && u.username===username && u.password===password);
  }

  if(!user) return alert("Invalid login details");

  currentUser = user;
  document.getElementById('authPage').classList.add('hidden');
  document.getElementById('dashboard').classList.remove('hidden');
  document.getElementById('welcomeText').innerText = `Welcome, ${user.username}`;
  switchTab('assignments');
}

function logout() {
  currentUser = null;
  document.getElementById('dashboard').classList.add('hidden');
  document.getElementById('authPage').classList.remove('hidden');
  document.getElementById('loginUsername').value = '';
  document.getElementById('loginPassword').value = '';
}

function goBack() {
  document.getElementById('dashboard').classList.add('hidden');
  document.getElementById('authPage').classList.remove('hidden');
}

function switchTab(tab) {
  ['assignments','results','stories'].forEach(t => {
    document.getElementById(`tab-${t}`).classList.remove('active');
    document.getElementById(`content-${t}`).classList.add('hidden');
  });
  document.getElementById(`tab-${tab}`).classList.add('active');
  document.getElementById(`content-${tab}`).classList.remove('hidden');

  if(tab==='assignments') loadAssignments();
  if(tab==='results') loadResults();
}

function loadAssignments() {
  const list = document.getElementById('assignmentsList');
  if(currentUser.role==='Student') {
    const userAssignments = db.assignments.filter(a => a.class===currentUser.class);
    list.innerHTML = userAssignments.length? userAssignments.map(a =>
      `<div class="story-card"><h3>${a.subject}</h3><p>${a.task}</p></div>`
    ).join('') : "No assignments yet.";
  } else {
    list.innerHTML = "<p>Teachers/Admins can add assignments in the admin panel.</p>";
  }
}

function loadResults() {
  const list = document.getElementById('resultsList');
  if(currentUser.role==='Student') {
    const userResults = db.results.filter(r => r.username===currentUser.username);
    list.innerHTML = userResults.length?
      `<table><tr><th>Subject</th><th>Score</th></tr>${userResults.map(r =>
        `<tr><td>${r.subject}</td><td>${r.score}</td></tr>`
      ).join('')}</table>` : "No results yet.";
  }
}

function loadStories() {
  const cat = document.getElementById('storyCategory').value;
  const list = document.getElementById('storiesList');
  if(!cat) { list.innerHTML = ""; return; }
  const catStories = stories[cat] || [];
  list.innerHTML = catStories.length? catStories.map(s =>
    `<div class="story-card"><h3>${s.title}</h3><p>${s.content}</p></div>`
  ).join('') : "<p>No stories available for this subject yet.</p>";
}
</script>
</body>
</html>
