
<select id="storySubject" onchange="loadStory()">
          <option value="">Select Subject</option>
          <option value="Nigerian History">Nigerian History</option>
        </select>
        <div id="storyContent"></div>
      </div>
    </div>
  </div>
</div>

<script>
let students = {
  "Basic Six": [
    {name: "Asikhia Diamond", pass: "1234"},
    {name: "Ogedengbe Success", pass: "5678"},
    {name: "Mbah Favour", pass: "9012"},
    {name: "Ike Favour", pass: "3456"},
    {name: "Sumape Miracle", pass: "7890"},
    {name: "Abu Fadilat", pass: "2345"},
    {name: "Igbinonba Osasenaga", pass: "6789"},
    {name: "Alo Chinonso", pass: "0123"},
    {name: "Omosigho Trinity", pass: "4567"},
    {name: "Odion Praise", pass: "8901"},
    {name: "Ifada Sonia", pass: "2346"},
    {name: "Aigbe God's Time", pass: "6780"},
    {name: "Erhun George", pass: "1122"},
    {name: "Izevbuwa Daisy", pass: "3344"},
    {name: "Edet Rose", pass: "5566"}
  ]
};

let subjects = ["Mathematics", "English", "Prevocational Studies", "CCA"];
let assignments = [];
let stories = {
  "Nigerian History": [
  {
    title: "The story of Moremi and her sacrifice for Ile-Ife.",
    content: "Moremi was a brave queen of Ile-Ife who risked her life to discover the secret of the Igbo people who were attacking her kingdom. She dressed as a slave, got captured, and learned that they were spirits covered in raffia. She escaped and told her people, who then defeated them. Afterward, she sacrificed her only son as promised to the gods for victory."
  },
  {
    title: "How the River Niger got its name.",
    content: "The name 'Niger' comes from the Latin word 'niger' meaning black. Early European explorers saw the dark water of the river and called it River Niger. The river is one of the longest in Africa and is very important for trade, farming, and transportation in Nigeria."
  },
  {
    title: "The Nigerian Civil War 1967-1970 - causes and effects.",
    content: "The Nigerian Civil War, also called the Biafran War, happened because of ethnic tensions, political disagreements, and control of oil resources. It lasted from 1967 to 1970 between the Nigerian government and the secessionist state of Biafra. Over a million people died, mostly from hunger and disease. The war ended with Biafra rejoining Nigeria."
  },
  {
    title: "The First Republic 1963-1966 and the Second Republic 1979-1983.",
    content: "The First Republic ran from 1963 to 1966 under Prime Minister Tafawa Balewa and President Nnamdi Azikiwe. It ended with a military coup. The Second Republic ran from 1979 to 1983 under President Shehu Shagari. It was Nigeria’s second attempt at civilian rule but also ended with a military coup due to corruption and economic problems."
  }
]
  };
const adminUser = "admin";
const adminPass = "admin123";

function login() {
  const role = document.getElementById("role").value;

  if (role === "admin") {
    const user = document.getElementById("adminUser").value;
    const pass = document.getElementById("adminPass").value;
    if (user === adminUser && pass === adminPass) {
      showPortal("admin", "Admin");
    } else {
      alert("Wrong admin credentials");
    }
  }

  if (role === "student") {
    const cls = document.getElementById("studentClass").value;
    const name = document.getElementById("studentName").value;
    const pass = document.getElementById("studentPass").value;
    const student = students[cls]?.find(s => s.name === name && s.pass === pass);
    if (student) {
      showPortal("student", name);
    } else {
      alert("Wrong student details or passcode");
    }
  }
}

function showPortal(role, name) {
  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("portal").classList.remove("hidden");
  document.getElementById("welcome").innerText = `Welcome, ${name}`;

  if (role === "admin") {
    document.getElementById("adminPanel").classList.remove("hidden");
    updateSubjectDropdowns();
  }
  if (role === "student") {
    document.getElementById("studentPanel").classList.remove("hidden");
    loadAssignments();
  }
}

function logout() {
  document.getElementById("portal").classList.add("hidden");
  document.getElementById("loginScreen").classList.remove("hidden");
  document.getElementById("adminPanel").classList.add("hidden");
  document.getElementById("studentPanel").classList.add("hidden");
  document.getElementById("role").value = "";
  document.getElementById("adminUser").value = "";
  document.getElementById("adminPass").value = "";
  document.getElementById("studentPass").value = "";
}

document.getElementById("role").addEventListener("change", function() {
  document.getElementById("adminLogin").classList.add("hidden");
  document.getElementById("studentLogin").classList.add("hidden");
  if (this.value === "admin") document.getElementById("adminLogin").classList.remove("hidden");
  if (this.value === "student") document.getElementById("studentLogin").classList.remove("hidden");
});

document.getElementById("studentClass").addEventListener("change", function() {
  const cls = this.value;
  const nameSelect = document.getElementById("studentName");
  nameSelect.innerHTML = '<option value="">Select Student</option>';
  if (students[cls]) {
    students[cls].forEach(s => {
      nameSelect.innerHTML += `<option value="${s.name}">${s.name}</option>`;
    });
  }
});

function addStudent() {
  const name = document.getElementById("newStudentName").value.trim();
  const pass = document.getElementById("newStudentPass").value.trim();
  if (!name ||!pass || pass.length!== 4) {
    alert("Enter valid name and 4-digit passcode");
    return;
  }
  students["Basic Six"].push({name, pass});
  alert(`${name} added successfully!`);
  document.getElementById("newStudentName").value = "";
  document.getElementById("newStudentPass").value = "";
}

function addSubject() {
  const subj = document.getElementById("newSubject").value.trim();
  if (!subj) return alert("Enter subject name");
  subjects.push(subj);
  updateSubjectDropdowns();
  alert(`${subj} added!`);
  document.getElementById("newSubject").value = "";
}

function updateSubjectDropdowns() {
  const assignSel = document.getElementById("assignSubject");
  assignSel.innerHTML = "";
  subjects.forEach(s => {
    assignSel.innerHTML += `<option value="${s}">${s}</option>`;
  });
}

function viewStudents() {
  const listDiv = document.getElementById("studentList");
  listDiv.classList.remove("hidden");
  let html = "<strong>Basic Six Students:</strong><br><br>";
  students["Basic Six"].forEach(s => {
    html += `<span style="color:#1976d2;">${s.name}</span> - Code: <strong>${s.pass}</strong><br>`;
  });
  listDiv.innerHTML = html;
}

function postAssignment() {
  const subj = document.getElementById("assignSubject").value;
  const text = document.getElementById("assignmentText").value.trim();
  if (!text) return alert("Enter assignment text");
  assignments.push(`${subj}: ${text}`);
  alert("Assignment posted!");
  document.getElementById("assignmentText").value = "";
  loadAssignments();
}

function loadAssignments() {
  let html = "";
  if (assignments.length === 0) {
    html = "No assignments yet.";
  } else {
    assignments.forEach(a => {
      html += `<div class="story">${a}</div>`;
    });
  }
  document.getElementById("assignmentList").innerHTML = html;
}

function loadStory() {
  const subj = document.getElementById("storySubject").value;
  const content = document.getElementById("storyContent");
  if (stories[subj]) {
    content.innerHTML = stories[subj].map(s =>
      `<div class="story"><h3>${s.title}</h3><p>${s.content}</p></div>`
    ).join("");
  } else {
    content.innerHTML = "";
  }
}
</script>
</body>
</html>
