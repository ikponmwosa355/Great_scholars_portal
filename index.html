
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic Six Online Assignment</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body>
  <div class="container">
    <h1>Basic Six Assignment Portal</h1>
    
    <form id="assignmentForm">
      <input type="text" id="title" placeholder="Assignment Title" required>
      <input type="text" id="subject" placeholder="Subject" required>
      <input type="date" id="dueDate" required>
      <textarea id="description" placeholder="Description" required></textarea>
      <button type="submit">Submit Assignment</button>
    </form>

    <h2>Submitted Assignments</h2>
    <div id="assignmentList"></div>
  </div>

  <script>
    // Your Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyBhkP8E0ST4DE7-kBOdGXs8frhvSmIKCRI",
      authDomain: "basic-six-online-assignment.firebaseapp.com",
      projectId: "basic-six-online-assignment",
      storageBucket: "basic-six-online-assignment.firebasestorage.app",
      messagingSenderId: "219827342901",
      appId: "1:219827342901:web:1906ceed79c320ee2e6b7c"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Get form and list elements
    const form = document.getElementById('assignmentForm');
    const list = document.getElementById('assignmentList');

    // Submit form - save to Firebase
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const assignment = {
        title: document.getElementById('title').value,
        subject: document.getElementById('subject').value,
        dueDate: document.getElementById('dueDate').value,
        description: document.getElementById('description').value,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      try {
        await db.collection('assignments').add(assignment);
        form.reset();
        alert('Assignment submitted!');
      } catch (error) {
        console.error('Error adding document: ', error);
        alert('Error submitting assignment');
      }
    });

    // Load assignments in real-time
    db.collection('assignments')
      .orderBy('createdAt', 'desc')
      .onSnapshot((snapshot) => {
        list.innerHTML = '';
        snapshot.forEach((doc) => {
          const data = doc.data();
          const item = document.createElement('div');
          item.className = 'assignment-item';
          item.innerHTML = `
            <h3>${data.title}</h3>
            <p><strong>Subject:</strong> ${data.subject}</p>
            <p><strong>Due:</strong> ${data.dueDate}</p>
            <p>${data.description}</p>
          `;
          list.appendChild(item);
        });
      });
  </script>
</body>
</html>
